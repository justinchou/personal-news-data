name: live-prices

# Session-aware refresh of data/live/prices.json.
# The Actions run list shows two kinds of runs (see run-name):
#   - collector: the loop job. Its wall clock is ~5h40 of sleep. Each cycle is a few seconds.
#     Open the run and read the latest "summary" line, or data/live/status.json on main, for the
#     last successful fetch. Do not read the job duration as request time.
#   - watchdog: cron 11,41 * * * * (and manual mode=watchdog). It exits in seconds when a collector
#     is active or queued, and the collector job is skipped. That skip is the healthy path.
#     GitHub often drops this cron for hours; it is only a backstop, not the cadence.
# Cadence is the collector: every 5 minutes (:02, :07, …) scripts/fetch_live.py asks the calendar
# which groups are due. After ~5h40 (the job limit is 6h) the job dispatches the next run and exits.
# Concurrency group live-prices-loop (cancel-in-progress: false) holds the new run until this one
# finishes, so two collectors never write at once. Keep that group name: renaming it lets an old
# in-flight collector overlap a new one.
# To stop everything: Actions → live-prices → "…" → Disable workflow.
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'watchdog') && 'watchdog' || 'collector' }}
on:
  schedule:
    - cron: "11,41 * * * *"   # watchdog, off the top of the hour. UTC. Not the fetch cadence.
  workflow_dispatch:
    inputs:
      force:
        description: "Groups to fetch on the first iteration regardless of schedule: all, or e.g. us_equity,crypto"
        required: false
        default: ""
      minutes:
        description: "Loop length in minutes before handing over to the next run (max 340)"
        required: false
        default: "340"
      mode:
        description: "loop = start a collector (waits for any active one); watchdog = exit if a collector is active"
        required: false
        default: "loop"
        type: choice
        options: [loop, watchdog]

permissions:
  contents: write
  actions: write

jobs:
  guard:
    name: ${{ (github.event_name == 'schedule' || inputs.mode == 'watchdog') && 'watchdog' || 'gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      start: ${{ steps.g.outputs.start }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            livedata
            data/live
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'schedule' && 'watchdog' || inputs.mode }}
        run: |
          if [ "$MODE" = "watchdog" ]; then python3 scripts/loop_guard.py
          else echo "start=true" >> "$GITHUB_OUTPUT"; echo "gate: starting collector" >> "$GITHUB_STEP_SUMMARY"; fi

  loop:
    name: collector
    needs: guard
    if: needs.guard.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: live-prices-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch loop
        env:
          FORCE: ${{ inputs.force }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          m=${MINUTES:-340}; case "$m" in ''|*[!0-9]*) m=340;; esac; [ "$m" -gt 340 ] && m=340
          LOOP_MINUTES=$m scripts/live_loop.sh
      - name: Hand over to the next loop run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do gh workflow run live-prices.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0; sleep 10; done
          echo "::error::could not dispatch the next loop run; the watchdog cron will restart it"; exit 1
