# Symbols fetched by the live price job. `key` matches the page id on personal-news-site
# (watchlist slug or asset id); `code` is the Tencent quote code; `market` picks the session calendar
# in config/market_calendar.yml. Keep in sync with the site's public watchlist.
sources:
  tencent:
    name: 腾讯行情
    name_en: Tencent quotes
    url: https://qt.gtimg.cn/
    delay: 未公开（以行情时间为准）
    delay_en: not published (see quote time)
  coinbase:
    name: Coinbase Exchange
    name_en: Coinbase Exchange
    url: https://docs.cdp.coinbase.com/exchange/rest-api/rate-limits
    delay: 实时（24 小时涨跌）
    delay_en: real-time (24h change)
